		.error_wrap .con .con_wrap > ul > li {position:relative;padding-left:20px;color:#515151;line-height:1.4;letter-spacing:-0.5px;font-weight:500;word-break:keep-all;word-wrap:break-word;}

		.error_wrap .con .con_wrap > ul > li li {position:relative;padding-left:13px;}
		.error_wrap .con .con_wrap > ul > li li::before {content:'-';position:absolute;left:0;top:0;}
		.error_wrap .con .con_wrap > ul > li li + li {margin-top:7px;}
		.error_wrap .foot {padding:11px 15px 12px;text-align:center;}
		.error_wrap .foot img {vertical-align:top;}

			.error_wrap .con .con_wrap > ul > li strong {font-size:16px;display:block;margin-bottom:2px;}
			.error_wrap .con .con_wrap > ul > li li + li {margin-top:4px;}
			.error_wrap .con p.guide {font-size:14px;}
