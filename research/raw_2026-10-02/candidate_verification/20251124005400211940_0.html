<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="전남청년센터와 광주청년센터 바로가기">
  <title>전남광주통합특별시 청년센터</title>
  <style>
    :root {
      --ink: #252a2d;
      --muted: #4e5b61;
      --orange: #ff7a22;
      --orange-deep: #ee5c13;
      --green: #099a61;
      --green-deep: #027a52;
      --soft-orange: #fff1e6;
      --soft-green: #edf8ef;
      --paper: #fffdfa;
      --line: rgba(37, 42, 45, 0.08);
      --shadow: 0 26px 60px rgba(33, 38, 42, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      letter-spacing: 0;
      background:
        linear-gradient(135deg, rgba(255, 122, 34, 0.10) 0 12%, transparent 12% 100%),
        linear-gradient(315deg, rgba(9, 154, 97, 0.10) 0 12%, transparent 12% 100%),
        #fffdfa;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 72px 24px 82px;
      overflow: hidden;
    }

    .page::before,
    .page::after {
      position: absolute;
      z-index: 0;
      content: "";
      pointer-events: none;
    }

    .page::before {
      top: 128px;
      left: 0;
      width: 180px;
      height: 180px;
      opacity: 0.5;
      background-image: radial-gradient(rgba(255, 122, 34, 0.42) 2px, transparent 2px);
      background-size: 16px 16px;
    }

    .page::after {
      right: 56px;
      bottom: 158px;
      width: 140px;
      height: 140px;
      opacity: 0.5;
      background-image: radial-gradient(rgba(9, 154, 97, 0.35) 2px, transparent 2px);
      background-size: 16px 16px;
    }

    .wash {
      position: absolute;
      z-index: 0;
      width: 360px;
      height: 230px;
      pointer-events: none;
      opacity: 0.45;
      filter: blur(1px);
    }

    .wash-orange {
      top: -74px;
      left: -76px;
      background: linear-gradient(135deg, rgba(255, 160, 78, 0.34), rgba(255, 228, 204, 0.14));
      clip-path: polygon(0 0, 82% 0, 100% 62%, 26% 100%, 0 76%);
    }

    .wash-green {
      top: -64px;
      right: -76px;
      background: linear-gradient(225deg, rgba(9, 154, 97, 0.22), rgba(207, 236, 212, 0.15));
      clip-path: polygon(18% 0, 100% 0, 100% 76%, 58% 100%, 0 60%);
    }

    .decor-leaf {
      position: absolute;
      z-index: 0;
      width: 30px;
      height: 16px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, rgba(112, 190, 112, 0.82), rgba(176, 226, 155, 0.42));
      transform: rotate(-24deg);
      pointer-events: none;
    }

    .decor-leaf::after {
      position: absolute;
      top: 7px;
      left: 3px;
      width: 24px;
      height: 1px;
      content: "";
      background: rgba(58, 146, 79, 0.38);
      transform: rotate(-26deg);
    }

    .leaf-a {
      top: 28%;
      left: 16%;
    }

    .leaf-b {
      right: 10%;
      top: 25%;
      transform: rotate(22deg);
    }

    .leaf-c {
      right: 6%;
      top: 45%;
      transform: rotate(-18deg);
    }

    .leaf-d {
      left: 6%;
      bottom: 28%;
      transform: rotate(18deg);
    }

    .plus {
      position: absolute;
      z-index: 0;
      width: 22px;
      height: 22px;
      pointer-events: none;
      opacity: 0.45;
    }

    .plus::before,
    .plus::after {
      position: absolute;
      content: "";
      border-radius: 999px;
      background: rgba(9, 154, 97, 0.20);
    }

    .plus::before {
      top: 9px;
      left: 2px;
      width: 18px;
      height: 4px;
    }

    .plus::after {
      top: 2px;
      left: 9px;
      width: 4px;
      height: 18px;
    }

    .plus-one {
      top: 25%;
      right: 6%;
    }

    .plus-two {
      bottom: 18%;
      left: 4%;
    }

    .plus-two::before,
    .plus-two::after {
      background: rgba(255, 122, 34, 0.24);
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .hero {
      margin: 0 auto 52px;
      text-align: center;
    }

    .marker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 18px;
      margin-bottom: 18px;
    }

    .marker span {
      display: block;
      height: 8px;
      border-radius: 999px;
    }

    .marker .short {
      width: 12px;
      background: #ff7a22;
    }

    .marker .long-orange {
      width: 22px;
      background: #ff7a22;
    }

    .marker .long-green {
      width: 28px;
      background: #12996b;
    }

    .marker .pale {
      width: 18px;
      background: #b8e0d3;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 25px;
      font-weight: 500;
      line-height: 1.45;
    }

    .title {
      margin: 0;
      font-size: 70px;
      font-weight: 900;
      line-height: 1.08;
      word-break: keep-all;
    }

    .title .jeonnam {
      color: var(--orange);
      text-shadow: 0 8px 18px rgba(255, 122, 34, 0.18);
    }

    .title .gwangju {
      color: var(--green);
      text-shadow: 0 8px 18px rgba(9, 154, 97, 0.15);
    }

    .title .center {
      color: #24282b;
      text-shadow: 0 8px 18px rgba(37, 42, 45, 0.12);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(320px, 520px));
      justify-content: center;
      gap: 44px;
    }

    .card {
      position: relative;
      min-width: 0;
      min-height: 492px;
      padding: 38px 40px 40px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 8px;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .card-orange {
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.90) 0 24%, rgba(255, 241, 230, 0.92) 25% 100%),
        var(--soft-orange);
    }

    .card-green {
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.92) 0 24%, rgba(237, 248, 239, 0.93) 25% 100%),
        var(--soft-green);
    }

    .card::before {
      position: absolute;
      inset: 0;
      z-index: -2;
      content: "";
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.20), rgba(255, 255, 255, 0)),
        radial-gradient(circle at 24% 24%, rgba(255, 255, 255, 0.82), transparent 28%);
      opacity: 0.9;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      min-height: 414px;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo-badge {
      display: grid;
      width: 86px;
      height: 86px;
      margin-bottom: 34px;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 14px 34px rgba(36, 40, 43, 0.10);
    }

    .logo-badge svg {
      display: block;
      width: 57px;
      height: 57px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 35px;
      font-weight: 900;
      line-height: 1.22;
      word-break: keep-all;
    }

    .card-orange h2 {
      color: var(--orange-deep);
    }

    .card-green h2 {
      color: var(--green-deep);
    }

    .english {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.4;
    }

    .small-line {
      width: 32px;
      height: 6px;
      margin-top: 28px;
      border-radius: 999px;
    }

    .card-orange .small-line {
      background: linear-gradient(90deg, var(--orange), #ffb56d);
    }

    .card-green .small-line {
      background: linear-gradient(90deg, var(--green), #7ed1a4);
    }

    .card-spacer {
      flex: 1 1 auto;
      min-height: 110px;
    }

    .visit {
      display: flex;
      width: min(370px, 100%);
      min-height: 58px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 28px 0 34px;
      border-radius: 999px;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.13);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .visit:hover,
    .visit:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.17);
      outline: none;
    }

    .visit-orange {
      background: linear-gradient(90deg, #ff8b32, #ff7a22);
    }

    .visit-green {
      background: linear-gradient(90deg, #0b9b62, #0aa265);
    }

    .arrow {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      place-items: center;
    }

    .arrow svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 3.1;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
      padding-left: 10px;
    }

    .social {
      position: relative;
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border-radius: 50%;
      box-shadow: 0 10px 22px rgba(24, 29, 33, 0.14);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .social:hover,
    .social:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 15px 26px rgba(24, 29, 33, 0.18);
      outline: none;
    }

    .social svg {
      display: block;
      width: 30px;
      height: 30px;
    }

    .instagram {
      background: radial-gradient(circle at 32% 105%, #ffdd55 0 20%, #ff543e 42%, #c837ab 68%, #5851db 100%);
    }

    .kakao {
      color: #151515;
      background: #ffe600;
    }

    .youtube {
      background: #ff1f1f;
    }

    .blog {
      color: #21b53a;
      background: #25c945;
    }

    .facebook {
      background: #1877f2;
    }

    .scene {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }

    .bridge {
      right: -8px;
      bottom: 120px;
      width: 360px;
      height: 190px;
      opacity: 0.35;
    }

    .birds {
      top: 86px;
      right: 150px;
      width: 88px;
      height: 34px;
      opacity: 0.58;
    }

    .branch {
      top: -8px;
      right: -18px;
      width: 260px;
      height: 210px;
      opacity: 0.72;
    }

    .mountains {
      right: -12px;
      bottom: 0;
      width: 360px;
      height: 152px;
      opacity: 0.54;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1020px) {
      .page {
        padding: 56px 20px 62px;
      }

      .title {
        font-size: 52px;
      }

      .eyebrow {
        font-size: 22px;
      }

      .cards {
        grid-template-columns: minmax(280px, 560px);
        gap: 28px;
      }

      .card {
        min-height: 468px;
      }
    }

    @media (max-width: 640px) {
      .page {
        display: flex;
        min-height: 100svh;
        align-items: center;
        padding: 9px 8px 55px;
      }

      .wrap {
        width: min(420px, 100%);
        margin: 0;
      }

      .page::before,
      .page::after,
      .wash,
      .decor-leaf,
      .plus {
        opacity: 0.22;
      }

      .hero {
        margin-bottom: 14px;
      }

      .marker {
        height: 10px;
        margin-bottom: 8px;
      }

      .marker span {
        height: 5px;
      }

      .eyebrow {
        margin-bottom: 6px;
        font-size: 12px;
      }

      .title {
        font-size: clamp(25px, 7.4vw, 31px);
        line-height: 1.12;
      }

      .title .center {
        display: block;
      }

      .cards {
        width: 100%;
        grid-template-columns: 1fr;
        gap: 18px;
        margin-top: 44px;
      }

      .card {
        min-height: 0;
        padding: 16px;
        box-shadow: 0 16px 34px rgba(33, 38, 42, 0.12);
      }

      .card-content {
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr) minmax(132px, 42%);
        grid-template-areas:
          "badge title visit"
          "badge english visit"
          "badge line visit"
          "badge socials socials";
        column-gap: 10px;
        row-gap: 4px;
        align-items: center;
        min-height: 0;
        height: 100%;
      }

      .logo-badge {
        grid-area: badge;
        width: 44px;
        height: 44px;
        margin-bottom: 0;
      }

      .logo-badge svg {
        width: 30px;
        height: 30px;
      }

      .card h2 {
        grid-area: title;
        margin-bottom: 0;
        font-size: clamp(19px, 5.2vw, 22px);
      }

      .english {
        grid-area: english;
        font-size: 10px;
      }

      .small-line {
        grid-area: line;
        width: 20px;
        height: 4px;
        margin-top: 2px;
      }

      .card-spacer {
        display: none;
      }

      .visit {
        grid-area: visit;
        width: 100%;
        min-width: 0;
        min-height: 42px;
        gap: 6px;
        padding: 0 10px 0 13px;
        border-radius: 22px;
        font-size: 11px;
      }

      .visit span:first-child {
        min-width: 0;
        white-space: normal;
        word-break: keep-all;
      }

      .socials {
        grid-area: socials;
        max-width: 100%;
        gap: 6px;
        margin-top: 8px;
        padding-left: 0;
        overflow-x: visible;
        overflow-y: hidden;
        flex-wrap: nowrap;
      }

      .social {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        box-shadow: none;
      }

      .social:hover,
      .social:focus-visible {
        transform: none;
        box-shadow: none;
      }

      .social svg {
        width: 18px;
        height: 18px;
      }

      .arrow {
        width: 18px;
        height: 18px;
      }

      .arrow svg {
        width: 18px;
        height: 18px;
        stroke-width: 3;
      }

      .birds {
        display: none;
      }
    }

    @media (max-width: 360px) {
      .page {
        padding: 9px 6px 49px;
      }

      .cards {
        gap: 16px;
        margin-top: 38px;
      }

      .card {
        padding: 14px 12px;
      }

      .card-content {
        grid-template-columns: 42px minmax(0, 1fr) minmax(122px, 42%);
        grid-template-areas:
          "badge title visit"
          "badge english visit"
          "badge line visit"
          "badge socials socials";
        column-gap: 8px;
      }

      .logo-badge {
        width: 42px;
        height: 42px;
      }

      .card h2 {
        font-size: 19px;
      }

      .visit {
        min-height: 40px;
        padding: 0 9px 0 11px;
        font-size: 10px;
      }

      .social {
        width: 27px;
        height: 27px;
        flex-basis: 27px;
      }

      .social svg {
        width: 17px;
        height: 17px;
      }
    }

    @media (max-width: 340px) {
      .card-content {
        grid-template-columns: 40px minmax(0, 1fr);
        grid-template-areas:
          "badge title"
          "badge english"
          "badge line"
          "badge visit"
          "badge socials";
      }

      .visit {
        justify-self: start;
        width: min(190px, 100%);
        margin-top: 4px;
      }

      .socials {
        gap: 5px;
      }

      .social {
        width: 25px;
        height: 25px;
        flex-basis: 25px;
      }
    }

    @media (max-width: 640px) and (max-height: 700px) {
      .page {
        padding-top: 11px;
        padding-bottom: 45px;
      }

      .marker {
        display: none;
      }

      .hero {
        margin-bottom: 14px;
      }

      .title {
        font-size: clamp(23px, 7vw, 28px);
      }

      .logo-badge {
        width: 38px;
        height: 38px;
        margin-bottom: 8px;
      }

      .card {
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .socials {
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="wash wash-orange" aria-hidden="true"></span>
    <span class="wash wash-green" aria-hidden="true"></span>
    <span class="decor-leaf leaf-a" aria-hidden="true"></span>
    <span class="decor-leaf leaf-b" aria-hidden="true"></span>
    <span class="decor-leaf leaf-c" aria-hidden="true"></span>
    <span class="decor-leaf leaf-d" aria-hidden="true"></span>
    <span class="plus plus-one" aria-hidden="true"></span>
    <span class="plus plus-two" aria-hidden="true"></span>

    <div class="wrap">
      <header class="hero">
        <div class="marker" aria-hidden="true">
          <span class="short"></span>
          <span class="long-green"></span>
          <span class="pale"></span>
          <span class="short"></span>
        </div>
        <p class="eyebrow">지역과 함께, 청년의 내일을 만듭니다</p>
        <h1 class="title">
          <span class="jeonnam">전남</span><span class="gwangju">광주</span><span class="center">통합특별시 청년센터</span>
        </h1>
      </header>

      <section class="cards" aria-label="청년센터 바로가기">
        <article class="card card-orange">
          <svg class="scene birds" viewBox="0 0 88 34" aria-hidden="true">
            <path d="M5 18 Q13 8 21 18 M42 13 Q50 4 58 13 M68 25 Q76 16 84 25" fill="none" stroke="#f4a45d" stroke-width="3" stroke-linecap="round"></path>
          </svg>

          <div class="card-content">
            <div class="logo-badge" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <defs>
                  <linearGradient id="star-orange" x1="7" y1="8" x2="58" y2="59" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#ffbe2e"></stop>
                    <stop offset="0.45" stop-color="#ff7a22"></stop>
                    <stop offset="1" stop-color="#14a957"></stop>
                  </linearGradient>
                </defs>
                <path d="M32 8 L38.4 24.5 L56 24.7 L41.9 35.4 L47 52 L32 42.1 L17 52 L22.1 35.4 L8 24.7 L25.6 24.5 Z" fill="none" stroke="url(#star-orange)" stroke-width="8" stroke-linejoin="round"></path>
              </svg>
            </div>
            <h2>전남청년센터</h2>
            <p class="english">Jeonnam Youth Center</p>
            <span class="small-line" aria-hidden="true"></span>
            <div class="card-spacer"></div>
            <a class="visit visit-orange" href="/main.html" target="_blank" rel="noopener">
              <span>전남청년센터 바로가기</span>
              <span class="arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
            </a>
            <div class="socials" aria-label="전남청년센터 SNS">
              <a class="social instagram" href="https://instagram.com/jeonnam_youth/" target="_blank" rel="noopener" aria-label="전남청년센터 인스타그램">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                  <rect x="7" y="7" width="18" height="18" rx="5" stroke="#fff" stroke-width="2.7"></rect>
                  <circle cx="16" cy="16" r="4.4" stroke="#fff" stroke-width="2.7"></circle>
                  <circle cx="21.7" cy="10.5" r="1.6" fill="#fff"></circle>
                </svg>
              </a>
              <a class="social kakao" href="https://pf.kakao.com/_FxjxoDb" target="_blank" rel="noopener" aria-label="전남청년센터 카카오톡 채널">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <path d="M16 6.5c-6 0-10.8 3.8-10.8 8.5 0 3.1 2.1 5.8 5.2 7.3l-.9 3.5c-.1.5.4.8.8.5l4.1-2.8c.5.1 1.1.1 1.6.1 6 0 10.8-3.8 10.8-8.5S22 6.5 16 6.5z" fill="#151515"></path>
                  <text x="16" y="18.4" text-anchor="middle" font-size="8.2" font-weight="900" fill="#ffe600" font-family="Arial, sans-serif">Ch</text>
                </svg>
              </a>
            </div>
          </div>
        </article>

        <article class="card card-green">
          <div class="card-content">
            <div class="logo-badge" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <defs>
                  <linearGradient id="star-green" x1="9" y1="56" x2="54" y2="8" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#5cbf4a"></stop>
