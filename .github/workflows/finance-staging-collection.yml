name: Finance staging collection

on:
  schedule:
    - cron: '0 3 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        required: true
        default: stage-review
        type: choice
        options:
          - stage-review
          - raw-only

permissions:
  contents: read

concurrency:
  group: finance-staging-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yg-data-remote
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Collect raw responses and review JSON
        env:
          YOUTHCENTER_POLICY_API_KEY: ${{ secrets.YOUTHCENTER_POLICY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECTION_MODE: ${{ inputs.mode || 'stage-review' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in YOUTHCENTER_POLICY_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          case "$COLLECTION_MODE" in
            raw-only|stage-review) ;;
            *) echo '::error::Invalid collection mode'; exit 2 ;;
          esac
          python auto_collect.py --"$COLLECTION_MODE" --max-pages 6 --skip-existing-day
