# INACTIVE EXAMPLE: do not move to .github/workflows until test DB validation is complete.
# When activated, this file must live on the default branch (main).
name: Finance staging collection

on:
  schedule:
    - cron: '0 3 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        required: true
        default: stage-review
        type: choice
        options:
          - raw-only
          - stage-review

permissions:
  contents: read

concurrency:
  group: finance-staging-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yg-data-remote
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Collect private raw and review data
        env:
          YOUTHCENTER_POLICY_API_KEY: ${{ secrets.YOUTHCENTER_POLICY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECTION_MODE: ${{ inputs.mode || 'stage-review' }}
        run: |
          case "$COLLECTION_MODE" in
            raw-only|stage-review) ;;
            *) echo 'Invalid collection mode' >&2; exit 2 ;;
          esac
          python auto_collect.py --"$COLLECTION_MODE" --max-pages 6
